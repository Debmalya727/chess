group 'com.arjanaswal.stockfish'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.arjanaswal.stockfish'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

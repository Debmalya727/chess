name: stockfish_flutter_plus
description: A modern Flutter plugin providing the Stockfish chess engine with updated binaries,
  improved Android support (including 16kb page sizes), and a clean Dart API.
version: 1.0.1
homepage: https://github.com/Dexterfury/stockfish_flutter_plus
repository: https://github.com/Dexterfury/stockfish_flutter_plus

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.stockfish
        pluginClass: StockfishPlugin
      ios:
        pluginClass: StockfishPlugin
